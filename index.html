<!doctype html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tykkipeli</title><link rel="stylesheet" href="./style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script type="module" src="./app.js"></script></head><body><main><header><small>SYRVÄNKYYLÄ</small><h1>Laukausohjain</h1><p id="status" role="status">Avataan ohjainta…</p></header><form hidden><p id="info"></p><p id="warning"></p><fieldset><legend>Ammus</legend><div id="ammo"></div></fieldset><section id="aim"><label>Kulma <output id="angleValue"></output><input id="angle" type="range" min="0" max="180" step="1"></label><div class="adjust"><button type="button" data-adjust="angle:-1">−1°</button><span id="arrow">↑</span><button type="button" data-adjust="angle:1">+1°</button></div><label>Voima <output id="powerValue"></output><input id="power" type="range" min="1" max="100" step="1"></label><div class="adjust"><button type="button" data-adjust="power:-1">−1</button><button type="button" data-adjust="power:1">+1</button></div></section><label id="roller" hidden>Pyörijän suunta<select id="direction"><option value="0">Oikealle →</option><option value="180">← Vasemmalle</option></select></label><p id="review"></p><button id="send" type="submit">Vahvista laukaus</button><p>Host vahvistaa hyväksynnän Telegram-viestillä. Perinteinen ohjain: /tykki_perinteinen</p></form></main></body></html>
