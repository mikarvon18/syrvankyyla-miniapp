<!doctype html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tykkipeli</title><link rel="stylesheet" href="./style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script type="module" src="./app.js"></script></head><body><main><header><small>SYRVÄNKYYLÄ</small><h1>Laukausohjain</h1><p id="status" role="status">Avataan ohjainta…</p></header><form hidden><p id="warning"></p><button id="openAmmo" type="button" aria-haspopup="dialog">Valitse ammus</button><div class="controls"><section class="aim-panel"><svg id="cannon" viewBox="0 0 300 210" role="img" aria-label="Tykin tähtäyssuunta"><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#a5c0bb"/><stop offset="1" stop-color="#425e61"/></linearGradient></defs><path d="M25 175H275" stroke="#405861" stroke-width="2"/><path d="M48 152A102 102 0 0 1 252 152" fill="none" stroke="#405861" stroke-dasharray="4 6"/><text x="24" y="145">180°</text><text x="138" y="39">90°</text><text x="257" y="145">0°</text><g id="barrel" transform="rotate(-45 150 152)"><path d="M150 142H235V160H150Z" fill="url(#metal)" stroke="#c0d4c9" stroke-width="2"/><rect x="228" y="138" width="14" height="26" rx="3" fill="#ffcb6b"/></g><path d="M111 150Q150 124 189 150L196 169H104Z" fill="url(#metal)" stroke="#adc5ba" stroke-width="2"/><rect x="96" y="164" width="108" height="28" rx="14" fill="#23373a" stroke="#89a6a0" stroke-width="2"/><g fill="#667f7a"><circle cx="113" cy="178" r="8"/><circle cx="138" cy="178" r="8"/><circle cx="163" cy="178" r="8"/><circle cx="188" cy="178" r="8"/></g><circle cx="150" cy="152" r="10" fill="#ffcb6b"/></svg><section id="aim"><label for="angle">Suunta <output id="angleValue"></output></label><input id="angle" type="range" min="0" max="180" step="1" dir="rtl"><div class="adjust"><button type="button" data-adjust="angle:1" aria-label="Tähtää vasemmalle">← 1°</button><button type="button" data-adjust="angle:-1" aria-label="Tähtää oikealle">1° →</button></div></section><label id="roller" hidden>Pyörijän suunta<select id="direction"><option value="0">Oikealle →</option><option value="180">← Vasemmalle</option></select></label></section><section id="powerPanel"><label for="power">Voima<br><output id="powerValue"></output></label><div class="power-meter"><div class="power-color"></div><input id="power" type="range" min="1" max="100" step="1" aria-label="Voima"></div><div class="power-adjust"><button type="button" data-adjust="power:1" aria-label="Lisää voimaa">+</button><button type="button" data-adjust="power:-1" aria-label="Vähennä voimaa">−</button></div></section></div><div id="emotes" role="group" aria-label="Laukauksen emote"></div><p id="review"></p><button id="send" type="submit">Vahvista laukaus</button><small class="hint">Hyväksyntä Telegram-viestillä · /tykki_perinteinen</small></form><dialog id="ammoDialog" aria-labelledby="ammoTitle"><div class="dialog-header"><h2 id="ammoTitle">Valitse ammus</h2><button id="closeAmmo" type="button" aria-label="Sulje ammusvalikko">✕</button></div><div id="ammo"></div></dialog></main></body></html>
